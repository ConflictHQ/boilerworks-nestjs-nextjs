# The app on Astrolift: `astro app register` reads this file, and the managed
# workflow builds and deploys on every push to main.
#
# Rename before the first deploy: `name`, `[app].slug`, `display_name`,
# `repo` and the managed service names (a generated app replaces
# "boilerworks-app" everywhere). Astrolift builds one image per app, so the
# Next.js web app is its own app (apps/web/astrolift.toml), as is the
# Storybook (storybook/astrolift.toml).
#
# One workload, the api image (apps/api/Dockerfile):
#   api  NestJS (GraphQL, auth, jobs), bound to Postgres and Redis
# It is public: the browser calls the API directly (Apollo, session cookie),
# so the api's CORS_ORIGINS is the web app's public URL. Bindings inject
# DATABASE_URL (postgres) and REDIS_URL (redis). Secrets are created on the
# app:
#   astro app secrets create SESSION_SECRET --stdin

astrolift_version = 1
name = "boilerworks-app"

[app]
slug = "boilerworks-app"
display_name = "Boilerworks"
runtime = "node"
repo = "ConflictHQ/boilerworks-nestjs-nextjs"

[environments.production]

[[workloads]]
name = "api"
kind = "deployment"
is_public = true
replicas = 1
cpu_request = "250m"
cpu_limit = "1"
memory_request = "256Mi"
memory_limit = "512Mi"

  [[workloads.containers]]
  name = "api"
  is_primary = true
  dockerfile_path = "apps/api/Dockerfile"
  build_context = "apps/api"
  port = 4000

    [workloads.containers.healthcheck]
    kind = "http"
    value = "/health"
    port = 4000

[[managed_services]]
kind = "postgres"
name = "boilerworks-app-db"
owner_scope = "app"
environment = "production"
bind_workloads = ["api"]
size = "small"
deletion_policy = "retain"

  [managed_services.config]
  engine_version = "17"
  backup_retention_days = 7

[[managed_services]]
kind = "redis"
name = "boilerworks-app-redis"
bind_workloads = ["api"]
size = "small"
