version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    # Daily, so a new @calliopelabs/ui release arrives as its own pull request
    # within a day. The rest stays one grouped pull request, refreshed in place.
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # First match wins: the Calliope AI design system gets its own pull request.
      calliopelabs:
        patterns:
          - "@calliopelabs/*"
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
